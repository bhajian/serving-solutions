# In-cluster load generator for the routing comparison. CPU only; reaches the router
# through its ClusterIP Service. Code and dataset are copied in with kubectl cp, and
# results are copied out after every run (emptyDir does not survive a restart).
apiVersion: v1
kind: Pod
metadata:
  name: benchmark-client
  labels:
    serving-solutions/role: benchmark-client
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
  - name: client
    image: python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
    command:
    - sh
    - -c
    - pip install --no-cache-dir httpx==0.28.1 httpcore==1.0.9 h11==0.16.0 anyio==4.15.1 idna==3.20 certifi==2026.7.22 && touch /tmp/ready && sleep infinity
    workingDir: /bench
    readinessProbe:
      exec: {command: [test, -f, /tmp/ready]}
      periodSeconds: 5
    resources:
      requests: {cpu: '8', memory: 16Gi}
      limits: {memory: 32Gi}
    volumeMounts:
    - {name: bench, mountPath: /bench}
  volumes:
  - name: bench
    emptyDir: {}
