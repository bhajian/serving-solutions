apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
  namespace: llm-d
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: prefill
      llm-d.ai/role: prefill
      llm-d.ai/guide: two-node-pd
  template:
    metadata:
      labels: *id001
    spec:
      nodeSelector:
        kubernetes.io/hostname: prefill-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      containers:
      - name: modelserver
        image: vllm/vllm-openai:v0.30.0
        command:
        - python3
        - -c
        - "import os, sys\nfrom pathlib import Path\nfrom importlib.metadata import\
          \ version\nfrom packaging.version import Version\nrevision, backend, minimum,\
          \ *command = sys.argv[1:]\nmarker = Path('/model/DEPLOYED_REVISION')\nif\
          \ not marker.exists() or marker.read_text().strip() != revision:\n    raise\
          \ SystemExit('Checkpoint revision mismatch: verify /model/DEPLOYED_REVISION\
          \ on BOTH nodes')\nif Version(version(backend)) < Version(minimum):\n  \
          \  raise SystemExit('This model requires ' + backend + ' >= ' + minimum\
          \ + '; select a compatible complete runtime image')\nos.execvp(command[0],\
          \ command)\n"
        - 003f183a92fbe5b9a8325aaa8b2ae797c91dd90f
        - vllm
        - 0.26.0
        - vllm
        - serve
        - /model
        - --served-model-name
        - Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8
        - --tensor-parallel-size
        - '8'
        - --max-model-len
        - '32768'
        - --max-num-seqs
        - '32'
        - --max-num-batched-tokens
        - '8192'
        - --gpu-memory-utilization
        - '0.8'
        - --block-size
        - '128'
        - --kv-cache-dtype
        - auto
        - --enable-prefix-caching
        - --enable-auto-tool-choice
        - --tool-call-parser
        - qwen3_coder
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --kv-transfer-config
        - '{"kv_connector": "NixlConnector", "kv_role": "kv_producer", "kv_load_failure_policy":
          "fail"}'
        env:
        - name: HF_HOME
          value: /runtime/hf
        - name: HF_MODULES_CACHE
          value: /runtime/hf_modules
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: VLLM_CACHE_ROOT
          value: /runtime/vllm
        - name: TRITON_CACHE_DIR
          value: /runtime/triton
        - name: XDG_CACHE_HOME
          value: /runtime/cache
        - name: TORCH_EXTENSIONS_DIR
          value: /runtime/torch_extensions
        - name: PYTHONHASHSEED
          value: '0'
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
        - name: VLLM_HOST_IP
          value: <B300_NODE_A_IP>
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          value: <B300_NODE_A_IP>
        - name: VLLM_NIXL_SIDE_CHANNEL_PORT
          value: '5600'
        - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
          value: '120'
        - name: UCX_NET_DEVICES
          value: mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1,mlx5_10:1,mlx5_11:1
        - name: UCX_TLS
          value: rc_x,rc,cuda_copy,cuda_ipc
        - name: UCX_RNDV_SCHEME
          value: get_zcopy
        - name: UCX_RNDV_THRESH
          value: '0'
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: GLOO_SOCKET_IFNAME
          value: eth0
        - name: NCCL_IB_DISABLE
          value: '0'
        - name: NIXL_LOG_LEVEL
          value: INFO
        resources:
          requests:
            cpu: '16'
            memory: 256Gi
            nvidia.com/gpu: '8'
          limits:
            nvidia.com/gpu: '8'
            memory: 2Ti
        securityContext:
          runAsUser: 0
          privileged: true
          capabilities:
            add:
            - IPC_LOCK
        volumeMounts:
        - name: model
          mountPath: /model
          readOnly: true
        - name: runtime
          mountPath: /runtime
        - name: shm
          mountPath: /dev/shm
        - name: rdma
          mountPath: /dev/infiniband
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          timeoutSeconds: 5
          periodSeconds: 15
          failureThreshold: 480
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          timeoutSeconds: 5
          periodSeconds: 15
      volumes:
      - name: model
        hostPath:
          path: /data/models/qwen-480b
          type: Directory
      - name: runtime
        hostPath:
          path: /data/disagg/runtime/qwen-480b/llmd/vllm/prefill
          type: DirectoryOrCreate
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: rdma
        hostPath:
          path: /dev/infiniband
          type: Directory
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
