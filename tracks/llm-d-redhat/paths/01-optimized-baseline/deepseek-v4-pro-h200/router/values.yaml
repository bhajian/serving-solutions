# llm-d router (chart llm-d-router-standalone v0.11.0, llm-d v0.10.0): the
# optimized-baseline guide's base.values.yaml and optimized-baseline.values.yaml
# merged, with the model-server selector narrowed to this model. The scheduler
# (EndpointPickerConfig) comes from one arm-*.yaml file layered on top.
router:
  epp:
    replicas: 1
    flags:
      v: 2
      metrics-endpoint-auth: false   # lets the in-cluster benchmark client scrape :9090 (ClusterIP only)
    resources:
      requests:
        cpu: '4'
        memory: 8Gi
      limits:
        memory: 16Gi

  inferencePool:
    failureMode: FailOpen

  modelServers:
    protocol: http
    matchLabels:
      llm-d.ai/guide: optimized-baseline
      llm-d.ai/model: deepseek-v4-pro

  proxy:
    proxyType: envoy
    args:
    - --service-node
    - envoy-sidecar
    - --log-level
    - warn
    - --concurrency
    - '8'
    - --drain-strategy
    - immediate
    - --drain-time-s
    - '60'
    - -c
    - /etc/envoy/envoy.yaml
    resources:
      requests:
        cpu: '4'
        memory: 8Gi
      limits:
        memory: 16Gi

  extraServicePorts:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8081

  tracing:
    otelExporterEndpoint: http://localhost:4317
    sampling:
      sampler: parentbased_traceidratio
      samplerArg: '0.1'
