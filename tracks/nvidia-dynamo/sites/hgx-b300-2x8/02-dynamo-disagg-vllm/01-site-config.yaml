# ---------------------------------------------------------------------------
# EDIT ME: the only site-specific settings for this track.
# (Node placement uses node labels; see README.md step 1. Model path: see the
#  hostPath volumes in the worker manifest.)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-config
  namespace: dynamo-disagg-vllm
data:
  # Ethernet interface carrying the nodes' private IPs (NCCL/Gloo bootstrap).
  IP_IFACE: eth0
  # InfiniBand HCAs for KV-cache transfer (ibv_devinfo -l). Identical on both nodes.
  IB_DEVICES: "mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1,mlx5_10:1,mlx5_11:1"
