# ---------------------------------------------------------------------------
# etcd: Dynamo's service registry. Workers register here; the frontend watches it.
# Single replica with ephemeral storage: fine for a lab or PoC, because workers
# re-register on restart. For production see blueprint/10-production-operations.md.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: dynamo-agg-sglang
spec:
  replicas: 1
  selector:
    matchLabels: {app: etcd}
  template:
    metadata:
      labels: {app: etcd}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.21
          command:
            - /usr/local/bin/etcd
            - --name=default
            - --data-dir=/etcd-data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd.dynamo-agg-sglang.svc.cluster.local:2379
            - --listen-peer-urls=http://127.0.0.1:2380
            - --initial-advertise-peer-urls=http://127.0.0.1:2380
            - --initial-cluster=default=http://127.0.0.1:2380
          ports:
            - {name: client, containerPort: 2379}
          readinessProbe:
            httpGet: {path: /health, port: 2379}
            periodSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /etcd-data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: dynamo-agg-sglang
spec:
  selector: {app: etcd}
  ports:
    - {name: client, port: 2379, targetPort: 2379}
