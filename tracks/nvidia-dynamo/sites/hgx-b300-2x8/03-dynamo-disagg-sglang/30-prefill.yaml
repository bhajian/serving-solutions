# ---------------------------------------------------------------------------
# PREFILL worker: computes the prompt, then ships the KV cache to decode over InfiniBand.
# 8 GPUs, tensor parallel 8, host networking (the nodes' private IPs and, for
# disaggregation, the InfiniBand HCAs are used directly).
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
  namespace: dynamo-disagg-sglang
spec:
  replicas: 1
  strategy: {type: Recreate}           # a worker owns all 8 GPUs: stop old before starting new
  selector:
    matchLabels: {app: prefill}
  template:
    metadata:
      labels: {app: prefill}
    spec:
      nodeSelector:
        llm-serving/node: node-a         # prefill on Node A
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      containers:
        - name: prefill
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0
          command: ["bash", "-c"]
          args:
            - |
                set -e
                # Refuse to start if this node holds a different checkpoint revision.
                grep -qx 252a02f921642313abde19b29a723a16602fe25e /model/DEPLOYED_REVISION \
                  || { echo "Checkpoint revision mismatch in /model/DEPLOYED_REVISION"; exit 1; }
                # Disaggregated: same engine flags as aggregated, plus
                #   --disaggregation-mode prefill, NIXL transfer backend, bootstrap port 8998.
                exec python3 -m dynamo.sglang \
                  --disaggregation-mode prefill \
                  --disaggregation-transfer-backend nixl \
                  --disaggregation-bootstrap-port 8998 \
                  --model-path /model \
                  --served-model-name nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 \
                  --tensor-parallel-size 8 \
                  --trust-remote-code \
                  --context-length 32768 \
                  --max-running-requests 32 \
                  --chunked-prefill-size 8192 \
                  --mem-fraction-static 0.80 \
                  --page-size 64 \
                  --kv-cache-dtype auto \
                  --host 0.0.0.0 \
                  --port 30000 \
                  --enable-metrics \
                  --disable-piecewise-cuda-graph \
                  --dyn-tool-call-parser qwen3_coder \
                  --dyn-reasoning-parser nemotron3 \
                  --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571"}'
          env:
            # This node's IP, injected by Kubernetes (hostNetwork => node InternalIP).
            - name: HOST_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            # Site settings from 01-site-config.yaml.
            - name: IP_IFACE
              valueFrom: {configMapKeyRef: {name: site-config, key: IP_IFACE}}
            - name: IB_DEVICES
              valueFrom: {configMapKeyRef: {name: site-config, key: IB_DEVICES}}
            # Dynamo control plane. etcd is reached through its Service DNS name.
            - {name: DYN_NAMESPACE, value: dynamo-disagg-sglang}
            - {name: DYN_DISCOVERY_BACKEND, value: etcd}
            - {name: ETCD_ENDPOINTS, value: "http://etcd.dynamo-disagg-sglang.svc.cluster.local:2379"}
            - {name: DYN_REQUEST_PLANE, value: tcp}
            - {name: DYN_EVENT_PLANE, value: zmq}
            # Do NOT set DYN_TCP_RESPONSE_STREAM_HOST (breaks the Dynamo 1.4.0 frontend).
            - {name: DYN_TCP_RPC_HOST, value: "$(HOST_IP)"}
            - {name: DYN_EVENT_PLANE_HOST, value: "$(HOST_IP)"}
            - {name: PYTHONHASHSEED, value: "0"}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
            - {name: HF_HOME, value: /runtime/hf}
            - {name: HF_MODULES_CACHE, value: /runtime/hf_modules}
            - {name: XDG_CACHE_HOME, value: /runtime/cache}
            - {name: TRITON_CACHE_DIR, value: /runtime/triton}
            - {name: TORCH_EXTENSIONS_DIR, value: /runtime/torch_extensions}
            - {name: NCCL_SOCKET_IFNAME, value: "$(IP_IFACE)"}
            - {name: GLOO_SOCKET_IFNAME, value: "$(IP_IFACE)"}
            - {name: DYN_SYSTEM_PORT, value: "8081"}     # worker /health and /metrics
            # Nemotron 3 Ultra on SGLang.
            - {name: SGLANG_DISABLE_DEEP_GEMM, value: "1"}
            # ---- KV-cache transfer: SGLang NIXL engine over UCX over InfiniBand ----
            - {name: SGLANG_DISAGGREGATION_NIXL_BACKEND, value: UCX}
            - name: SGLANG_DISAGGREGATION_NIXL_BACKEND_PARAMS
              value: '{"ucx_devices": "$(IB_DEVICES)"}'
            - {name: UCX_NET_DEVICES, value: "$(IB_DEVICES)"}
            - {name: UCX_TLS, value: "rc_x,rc,cuda_copy,cuda_ipc"}
            - {name: UCX_RNDV_SCHEME, value: get_zcopy}
            - {name: UCX_RNDV_THRESH, value: "0"}
            - {name: NCCL_IB_DISABLE, value: "0"}
            - {name: NIXL_LOG_LEVEL, value: INFO}
          resources:
            requests: {cpu: "16", memory: 256Gi, nvidia.com/gpu: "8"}
            limits: {memory: 2Ti, nvidia.com/gpu: "8"}
          securityContext:
            runAsUser: 0
            # Lab default: privileged + /dev/infiniband gives the container RDMA access.
            # With the NVIDIA Network Operator, set privileged: false, remove the
            # "rdma" volume, and request your RDMA resource under resources.limits,
            # e.g. rdma/rdma_shared_device_a: 1 (use your cluster's actual name).
            privileged: true
            capabilities: {add: [IPC_LOCK]}   # pin memory for RDMA registration
          # Large checkpoints load and compile slowly: allow up to 2 hours to start.
          # No liveness probe: a long prefill must not get the worker killed.
          startupProbe:
            httpGet: {path: /health, port: 8081}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 480
          readinessProbe:
            httpGet: {path: /health, port: 8081}
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - {name: model, mountPath: /model, readOnly: true}
            - {name: runtime, mountPath: /runtime}
            - {name: shm, mountPath: /dev/shm}
            - {name: rdma, mountPath: /dev/infiniband}
      volumes:
        - name: model
          hostPath: {path: /data/nemotron-ultra/model, type: Directory}           # EDIT if needed; same revision on every node
        - name: runtime
          hostPath: {path: /data/nemotron-ultra/runtime/dynamo-disagg-sglang/prefill, type: DirectoryOrCreate}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 64Gi}
        - name: rdma
          hostPath: {path: /dev/infiniband, type: Directory}
