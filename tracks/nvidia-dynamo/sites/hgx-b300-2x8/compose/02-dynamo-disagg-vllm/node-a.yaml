# =============================================================================
# Disaggregated serving | Dynamo + vLLM | Node A = control plane + PREFILL
#
# Node A runs etcd, the Dynamo frontend and the PREFILL worker (8 GPUs, TP8).
# Node B runs the DECODE worker (see node-b.yaml).
#
# Request path:
#   client -> frontend (A:8000) -> prefill worker (A) builds the KV cache
#          -> KV cache moves A -> B over InfiniBand (NIXL + UCX, GPUDirect RDMA)
#          -> decode worker (B) streams tokens -> frontend -> client
#
# Run on Node A, from the repository root:
#   docker compose --env-file deploy/cluster.env -f tracks/nvidia-dynamo/sites/hgx-b300-2x8/compose/02-dynamo-disagg-vllm/node-a.yaml up -d etcd
#   docker compose --env-file deploy/cluster.env -f tracks/nvidia-dynamo/sites/hgx-b300-2x8/compose/02-dynamo-disagg-vllm/node-a.yaml up -d frontend prefill
# =============================================================================
name: disagg-vllm

x-dynamo-env: &dynamo-env
  DYN_NAMESPACE: disagg-vllm
  DYN_DISCOVERY_BACKEND: etcd
  ETCD_ENDPOINTS: http://${NODE_A_IP}:2379
  DYN_REQUEST_PLANE: tcp
  DYN_EVENT_PLANE: zmq
  # Do NOT set DYN_TCP_RESPONSE_STREAM_HOST (breaks the 1.4.0 frontend).
  DYN_TCP_RPC_HOST: ${NODE_A_IP}
  DYN_EVENT_PLANE_HOST: ${NODE_A_IP}
  PYTHONHASHSEED: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HOME: /runtime/hf
  HF_MODULES_CACHE: /runtime/hf_modules
  XDG_CACHE_HOME: /runtime/cache

x-vllm-env: &vllm-env
  <<: *dynamo-env
  VLLM_HOST_IP: ${NODE_A_IP}
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_CACHE_ROOT: /runtime/vllm
  TRITON_CACHE_DIR: /runtime/triton
  TORCH_EXTENSIONS_DIR: /runtime/torch_extensions
  NCCL_SOCKET_IFNAME: ${IP_IFACE}
  GLOO_SOCKET_IFNAME: ${IP_IFACE}
  NCCL_IB_DISABLE: "0"
  # ---- KV-cache transfer (new compared with aggregated) --------------------
  # NIXL is the transfer library; UCX is its transport. UCX must use the
  # InfiniBand HCAs (rc_x/rc = RDMA reliable connection) and CUDA memory types,
  # so KV blocks go GPU memory -> HCA -> wire -> HCA -> GPU memory (GPUDirect RDMA).
  VLLM_NIXL_SIDE_CHANNEL_HOST: ${NODE_A_IP}          # metadata handshake between workers
  VLLM_NIXL_SIDE_CHANNEL_PORT: "5600"
  UCX_NET_DEVICES: ${IB_DEVICES}
  UCX_TLS: rc_x,rc,cuda_copy,cuda_ipc
  UCX_RNDV_SCHEME: get_zcopy                         # zero-copy RDMA reads
  UCX_RNDV_THRESH: "0"
  NIXL_LOG_LEVEL: INFO
  # ---- Nemotron 3 Ultra specific ------------------------------------------
  VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
  VLLM_DISABLED_KERNELS: FlashInferFP8ScaledMMLinearKernel
  VLLM_SSM_CONV_STATE_LAYOUT: DS
  VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE: "1"
  DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS: "0"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    network_mode: host
    restart: unless-stopped
    entrypoint:
      - /usr/local/bin/etcd
      - --name=default
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${NODE_A_IP}:2379
      - --listen-peer-urls=http://127.0.0.1:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=default=http://127.0.0.1:2380
    volumes:
      - etcd-data:/etcd-data

  frontend:
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
    network_mode: host
    depends_on: [etcd]
    user: "0"
    environment:
      <<: *dynamo-env
    volumes:
      - ${MODEL_DIR}:/model:ro
      - ${RUNTIME_DIR}/disagg-vllm/frontend:/runtime
    entrypoint:
      - python3
      - -m
      - dynamo.frontend
      - --http-host=${NODE_A_IP}
      - --http-port=8000
      - --router-mode=kv
      - --router-kv-events
      - --kv-cache-block-size=64
    logging: &logging
      driver: json-file
      options: {max-size: 100m, max-file: "3"}

  prefill:
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
    network_mode: host
    ipc: host
    user: "0"
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband              # RDMA devices for NIXL/UCX
    cap_add: [IPC_LOCK]                              # pin (register) memory for RDMA
    ulimits:
      memlock: {soft: -1, hard: -1}
      stack: 67108864
    environment:
      <<: *vllm-env
      DYN_SYSTEM_PORT: "8081"
    volumes:
      - ${MODEL_DIR}:/model:ro
      - ${RUNTIME_DIR}/disagg-vllm/prefill:/runtime
    logging: *logging
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        grep -qx 252a02f921642313abde19b29a723a16602fe25e /model/DEPLOYED_REVISION \
          || { echo "Checkpoint revision mismatch in /model/DEPLOYED_REVISION"; exit 1; }

        # Same engine flags as the aggregated worker, plus two disaggregation flags:
        #   --disaggregation-mode prefill   this worker only computes prompts
        #   --kv-transfer-config NIXL       ship the resulting KV cache to decode
        # Prefill and decode MUST agree on model, TP, block size and KV dtype.
        exec python3 -m dynamo.vllm \
          --disaggregation-mode prefill \
          --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
          --model /model \
          --served-model-name nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 \
          --tensor-parallel-size 8 \
          --no-enable-expert-parallel \
          --trust-remote-code \
          --max-model-len 32768 \
          --max-num-seqs 32 \
          --max-num-batched-tokens 8192 \
          --gpu-memory-utilization 0.80 \
          --block-size 64 \
          --kv-cache-dtype fp8 \
          --enable-prefix-caching \
          --attention-backend FLASHINFER \
          --linear-backend cutlass \
          --moe-backend flashinfer_trtllm \
          --mamba-backend triton \
          --mamba-cache-mode align \
          --mamba-ssm-cache-dtype bfloat16 \
          --no-enable-flashinfer-autotune \
          --no-disable-hybrid-kv-cache-manager \
          --async-scheduling \
          --reasoning-parser-plugin /model/ultra_v3_reasoning_parser.py \
          --reasoning-parser nemotron_v3 \
          --dyn-tool-call-parser qwen3_coder \
          --dyn-reasoning-parser nemotron3 \
          --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://127.0.0.1:5571","enable_kv_cache_events":true}'

volumes:
  etcd-data: {}
