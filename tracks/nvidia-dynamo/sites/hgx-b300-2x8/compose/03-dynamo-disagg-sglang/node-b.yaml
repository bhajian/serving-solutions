# =============================================================================
# Disaggregated serving | Dynamo + SGLang | Node B = DECODE
#
# Start Node A first (etcd healthy, prefill initialising), then on Node B:
#   docker compose --env-file deploy/cluster.env -f tracks/nvidia-dynamo/sites/hgx-b300-2x8/compose/03-dynamo-disagg-sglang/node-b.yaml up -d
# =============================================================================
name: disagg-sglang

x-worker-env: &worker-env
  DYN_NAMESPACE: disagg-sglang
  DYN_DISCOVERY_BACKEND: etcd
  ETCD_ENDPOINTS: http://${NODE_A_IP}:2379
  DYN_REQUEST_PLANE: tcp
  DYN_EVENT_PLANE: zmq
  # Do NOT set DYN_TCP_RESPONSE_STREAM_HOST (breaks the 1.4.0 frontend).
  DYN_TCP_RPC_HOST: ${NODE_B_IP}
  DYN_EVENT_PLANE_HOST: ${NODE_B_IP}
  PYTHONHASHSEED: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HOME: /runtime/hf
  HF_MODULES_CACHE: /runtime/hf_modules
  XDG_CACHE_HOME: /runtime/cache
  TRITON_CACHE_DIR: /runtime/triton
  TORCH_EXTENSIONS_DIR: /runtime/torch_extensions
  NCCL_SOCKET_IFNAME: ${IP_IFACE}
  GLOO_SOCKET_IFNAME: ${IP_IFACE}
  # Nemotron 3 Ultra on SGLang: disable DeepGEMM kernels (per model profile).
  SGLANG_DISABLE_DEEP_GEMM: "1"
  NCCL_IB_DISABLE: "0"
  # ---- KV-cache transfer (new compared with aggregated) --------------------
  # SGLang's NIXL transfer engine, using UCX over the InfiniBand HCAs.
  SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
  SGLANG_DISAGGREGATION_NIXL_BACKEND_PARAMS: '{"ucx_devices": "${IB_DEVICES}"}'
  UCX_NET_DEVICES: ${IB_DEVICES}
  UCX_TLS: rc_x,rc,cuda_copy,cuda_ipc
  UCX_RNDV_SCHEME: get_zcopy
  UCX_RNDV_THRESH: "0"
  NIXL_LOG_LEVEL: INFO

services:
  decode:
    image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0
    network_mode: host
    ipc: host
    user: "0"
    gpus: all                                        # requires Docker Compose 2.30+
    devices:
      - /dev/infiniband:/dev/infiniband              # RDMA devices for NIXL/UCX
    cap_add: [IPC_LOCK]                              # pin (register) memory for RDMA
    ulimits:
      memlock: {soft: -1, hard: -1}
      stack: 67108864
    environment:
      <<: *worker-env
      DYN_SYSTEM_PORT: "8081"                        # /health and /metrics for this worker
    volumes:
      - ${MODEL_DIR}:/model:ro
      - ${RUNTIME_DIR}/disagg-sglang/decode:/runtime
    logging:
      driver: json-file
      options: {max-size: 100m, max-file: "3"}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        grep -qx 252a02f921642313abde19b29a723a16602fe25e /model/DEPLOYED_REVISION \
          || { echo "Checkpoint revision mismatch in /model/DEPLOYED_REVISION"; exit 1; }

        # Mirror of the prefill worker with --disaggregation-mode decode.
        # Decode connects to the prefill worker's bootstrap port 8998 (Node A).
        exec python3 -m dynamo.sglang \
          --disaggregation-mode decode \
          --disaggregation-transfer-backend nixl \
          --disaggregation-bootstrap-port 8998 \
          --model-path /model \
          --served-model-name nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 \
          --tensor-parallel-size 8 \
          --trust-remote-code \
          --context-length 32768 \
          --max-running-requests 32 \
          --chunked-prefill-size 8192 \
          --mem-fraction-static 0.80 \
          --page-size 64 \
          --kv-cache-dtype auto \
          --host 0.0.0.0 \
          --port 30000 \
          --enable-metrics \
          --disable-piecewise-cuda-graph \
          --dyn-tool-call-parser qwen3_coder \
          --dyn-reasoning-parser nemotron3 \
          --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571"}'
