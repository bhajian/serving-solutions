# =============================================================================
# Aggregated serving | Dynamo + vLLM | Node A
#
# Node A runs the control plane (etcd + Dynamo frontend) and ONE aggregated
# worker. "Aggregated" means this worker does BOTH phases of every request:
# prefill (read the prompt, build the KV cache) and decode (generate tokens).
#
# Run on Node A, from the repository root:
#   docker compose --env-file deploy/cluster.env -f tracks/nvidia-dynamo/sites/hgx-b300-2x8/compose/01-aggregated/vllm/node-a.yaml up -d
#
# Single-node lab? Run only this file. Two nodes? Also start node-b.yaml on
# Node B; the frontend's KV-aware router then balances across both workers.
# =============================================================================
name: agg-vllm

# ---------------------------------------------------------------------------
# Shared environment, reused below through YAML anchors (&name / <<: *name).
# ---------------------------------------------------------------------------
x-dynamo-env: &dynamo-env
  # Dynamo control plane: service discovery in etcd, requests over TCP,
  # KV-cache events over ZMQ. No NATS is needed with these settings.
  DYN_NAMESPACE: agg-vllm
  DYN_DISCOVERY_BACKEND: etcd
  ETCD_ENDPOINTS: http://${NODE_A_IP}:2379
  DYN_REQUEST_PLANE: tcp
  DYN_EVENT_PLANE: zmq
  # Addresses this node advertises to the other components.
  # NOTE: do NOT set DYN_TCP_RESPONSE_STREAM_HOST. In Dynamo 1.4.0 an explicit
  # value broke the frontend; automatic IPv4-first detection works.
  DYN_TCP_RPC_HOST: ${NODE_A_IP}
  DYN_EVENT_PLANE_HOST: ${NODE_A_IP}
  # Same hash seed in every process, so KV-block hashes match across workers.
  PYTHONHASHSEED: "0"
  # Weights are pre-downloaded; never reach out to Hugging Face at runtime.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HOME: /runtime/hf
  HF_MODULES_CACHE: /runtime/hf_modules
  XDG_CACHE_HOME: /runtime/cache

x-vllm-env: &vllm-env
  <<: *dynamo-env
  VLLM_HOST_IP: ${NODE_A_IP}
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_CACHE_ROOT: /runtime/vllm
  TRITON_CACHE_DIR: /runtime/triton
  TORCH_EXTENSIONS_DIR: /runtime/torch_extensions
  # Tensor parallelism inside the node runs over NVLink; NCCL bootstraps over Ethernet.
  NCCL_SOCKET_IFNAME: ${IP_IFACE}
  GLOO_SOCKET_IFNAME: ${IP_IFACE}
  # Nemotron 3 Ultra specific settings, taken from NVIDIA's recipe.
  VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
  VLLM_DISABLED_KERNELS: FlashInferFP8ScaledMMLinearKernel
  VLLM_SSM_CONV_STATE_LAYOUT: DS
  VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE: "1"

services:
  # -------------------------------------------------------------------------
  # 1. etcd: where workers register themselves and the frontend discovers them.
  #    Single instance, no TLS: lab / PoC only. See blueprint/10-production-operations.md.
  # -------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    network_mode: host
    restart: unless-stopped
    entrypoint:
      - /usr/local/bin/etcd
      - --name=default
      - --data-dir=/etcd-data
      # Listen on all interfaces; restrict port 2379 to the private network with your firewall.
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${NODE_A_IP}:2379
      - --listen-peer-urls=http://127.0.0.1:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=default=http://127.0.0.1:2380
    volumes:
      - etcd-data:/etcd-data

  # -------------------------------------------------------------------------
  # 2. Dynamo frontend: the OpenAI-compatible API (port 8000) and the
  #    KV-aware router that picks the worker with the best prefix-cache hit.
  # -------------------------------------------------------------------------
  frontend:
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
    network_mode: host
    depends_on: [etcd]
    user: "0"
    environment:
      <<: *dynamo-env
    volumes:
      - ${MODEL_DIR}:/model:ro                       # tokenizer + chat template
      - ${RUNTIME_DIR}/agg-vllm/frontend:/runtime
    entrypoint:
      - python3
      - -m
      - dynamo.frontend
      - --http-host=${NODE_A_IP}
      - --http-port=8000
      - --router-mode=kv                             # route by KV-cache overlap
      - --router-kv-events                           # workers publish cache events
      - --kv-cache-block-size=64                     # must equal the workers' --block-size
    logging: &logging
      driver: json-file
      options: {max-size: 100m, max-file: "3"}

  # -------------------------------------------------------------------------
  # 3. Aggregated worker: 8 GPUs, tensor parallel 8, prefill AND decode.
  # -------------------------------------------------------------------------
  worker:
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
    network_mode: host
    ipc: host                                        # large shared memory for TP workers
    user: "0"
    gpus: all                                        # requires Docker Compose 2.30+
    ulimits:
      memlock: {soft: -1, hard: -1}
      stack: 67108864
    environment:
      <<: *vllm-env
      DYN_SYSTEM_PORT: "8081"                        # /health and /metrics for this worker
    volumes:
      - ${MODEL_DIR}:/model:ro
      - ${RUNTIME_DIR}/agg-vllm/worker:/runtime
    logging: *logging
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        # Safety check: both nodes must serve the exact same checkpoint revision.
        grep -qx 252a02f921642313abde19b29a723a16602fe25e /model/DEPLOYED_REVISION \
          || { echo "Checkpoint revision mismatch in /model/DEPLOYED_REVISION"; exit 1; }

        # Flag groups (see tracks/nvidia-dynamo/sites/hgx-b300-2x8/01-aggregated/README.md for a line-by-line explanation):
        #   model + parallelism | capacity limits | Nemotron hybrid Mamba/attention kernels
        #   | parsers | KV events for the router.
        # There is NO --disaggregation-mode and NO --kv-transfer-config: this worker
        # never ships KV cache to another node.
        exec python3 -m dynamo.vllm \
          --model /model \
          --served-model-name nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 \
          --tensor-parallel-size 8 \
          --no-enable-expert-parallel \
          --trust-remote-code \
          --max-model-len 32768 \
          --max-num-seqs 32 \
          --max-num-batched-tokens 8192 \
          --gpu-memory-utilization 0.80 \
          --block-size 64 \
          --kv-cache-dtype fp8 \
          --enable-prefix-caching \
          --attention-backend FLASHINFER \
          --linear-backend cutlass \
          --moe-backend flashinfer_trtllm \
          --mamba-backend triton \
          --mamba-cache-mode align \
          --mamba-ssm-cache-dtype bfloat16 \
          --no-enable-flashinfer-autotune \
          --no-disable-hybrid-kv-cache-manager \
          --async-scheduling \
          --reasoning-parser-plugin /model/ultra_v3_reasoning_parser.py \
          --reasoning-parser nemotron_v3 \
          --dyn-tool-call-parser qwen3_coder \
          --dyn-reasoning-parser nemotron3 \
          --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://127.0.0.1:5571","enable_kv_cache_events":true}'

volumes:
  etcd-data: {}
