# =============================================================================
# Aggregated serving | Dynamo + SGLang | Node B (optional second replica)
#
# A second, identical aggregated worker. It registers in etcd on Node A and the
# frontend routes to it automatically. No KV cache moves between nodes.
#
# Start Node A first, then on Node B:
#   docker compose --env-file deploy/cluster.env -f tracks/nvidia-dynamo/sites/hgx-b300-2x8/compose/01-aggregated/sglang/node-b.yaml up -d
# =============================================================================
name: agg-sglang

x-worker-env: &worker-env
  DYN_NAMESPACE: agg-sglang
  DYN_DISCOVERY_BACKEND: etcd
  ETCD_ENDPOINTS: http://${NODE_A_IP}:2379
  DYN_REQUEST_PLANE: tcp
  DYN_EVENT_PLANE: zmq
  # Do NOT set DYN_TCP_RESPONSE_STREAM_HOST (breaks the 1.4.0 frontend).
  DYN_TCP_RPC_HOST: ${NODE_B_IP}
  DYN_EVENT_PLANE_HOST: ${NODE_B_IP}
  PYTHONHASHSEED: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HOME: /runtime/hf
  HF_MODULES_CACHE: /runtime/hf_modules
  XDG_CACHE_HOME: /runtime/cache
  TRITON_CACHE_DIR: /runtime/triton
  TORCH_EXTENSIONS_DIR: /runtime/torch_extensions
  NCCL_SOCKET_IFNAME: ${IP_IFACE}
  GLOO_SOCKET_IFNAME: ${IP_IFACE}
  # Nemotron 3 Ultra on SGLang: disable DeepGEMM kernels (per model profile).
  SGLANG_DISABLE_DEEP_GEMM: "1"

services:
  worker:
    image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0
    network_mode: host
    ipc: host
    user: "0"
    gpus: all                                        # requires Docker Compose 2.30+
    ulimits:
      memlock: {soft: -1, hard: -1}
      stack: 67108864
    environment:
      <<: *worker-env
      DYN_SYSTEM_PORT: "8081"                        # /health and /metrics for this worker
    volumes:
      - ${MODEL_DIR}:/model:ro
      - ${RUNTIME_DIR}/agg-sglang/worker:/runtime
    logging:
      driver: json-file
      options: {max-size: 100m, max-file: "3"}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        grep -qx 252a02f921642313abde19b29a723a16602fe25e /model/DEPLOYED_REVISION \
          || { echo "Checkpoint revision mismatch in /model/DEPLOYED_REVISION"; exit 1; }

        # SGLang flag names differ from vLLM (see reference/vllm-vs-sglang.md):
        #   --context-length = --max-model-len, --max-running-requests = --max-num-seqs,
        #   --chunked-prefill-size = --max-num-batched-tokens, --mem-fraction-static = --gpu-memory-utilization.
        # Port 30000 is SGLang's internal port; the public API is the Dynamo frontend on 8000.
        # No --disaggregation-* flags: this worker runs prefill AND decode.
        exec python3 -m dynamo.sglang \
          --model-path /model \
          --served-model-name nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 \
          --tensor-parallel-size 8 \
          --trust-remote-code \
          --context-length 32768 \
          --max-running-requests 32 \
          --chunked-prefill-size 8192 \
          --mem-fraction-static 0.80 \
          --page-size 64 \
          --kv-cache-dtype auto \
          --host 0.0.0.0 \
          --port 30000 \
          --enable-metrics \
          --disable-piecewise-cuda-graph \
          --dyn-tool-call-parser qwen3_coder \
          --dyn-reasoning-parser nemotron3 \
          --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571"}'
