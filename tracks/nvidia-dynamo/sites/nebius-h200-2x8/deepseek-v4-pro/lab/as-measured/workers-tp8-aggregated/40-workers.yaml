apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-0
  namespace: deepseek-v4-pro
  labels:
    serving-role: aggregated
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker-0
  template:
    metadata:
      labels:
        app: worker-0
        component: sglang-worker
        serving-role: aggregated
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      containers:
      - name: worker
        image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0@sha256:314bda9534498899ad855f8c72434f4015660521665025a587e73486b74917f3
        command:
        - python3
        - -c
        - import os, resource, sys; resource.setrlimit(resource.RLIMIT_MEMLOCK, (resource.RLIM_INFINITY,
          resource.RLIM_INFINITY)); os.execvp(sys.argv[1], sys.argv[1:])
        - python3
        - -m
        - dynamo.sglang
        - --model-path
        - /model
        - --served-model-name
        - deepseek-ai/DeepSeek-V4-Pro-0813
        - --tensor-parallel-size
        - '8'
        - --trust-remote-code
        - --context-length
        - '262144'
        - --max-running-requests
        - '4'
        - --chunked-prefill-size
        - '4096'
        - --mem-fraction-static
        - '0.88'
        - --page-size
        - '256'
        - --kv-cache-dtype
        - fp8_e4m3
        - --moe-runner-backend
        - marlin
        - --host
        - 0.0.0.0
        - --port
        - '30000'
        - --enable-metrics
        - --disable-piecewise-cuda-graph
        - --cuda-graph-max-bs-decode
        - '4'
        - --dyn-tool-call-parser
        - deepseek_v4
        - --dyn-reasoning-parser
        - deepseek_v4
        - --kv-events-config
        - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571"}'
        - --weight-loader-prefetch-checkpoints
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DYN_NAMESPACE
          value: deepseek-v4-pro
        - name: DYN_DISCOVERY_BACKEND
          value: etcd
        - name: ETCD_ENDPOINTS
          value: http://etcd.deepseek-v4-pro.svc.cluster.local:2379
        - name: DYN_REQUEST_PLANE
          value: tcp
        - name: DYN_EVENT_PLANE
          value: zmq
        - name: DYN_TCP_RPC_HOST
          value: $(HOST_IP)
        - name: DYN_EVENT_PLANE_HOST
          value: $(HOST_IP)
        - name: PYTHONHASHSEED
          value: '0'
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: HF_HOME
          value: /runtime/hf
        - name: HF_MODULES_CACHE
          value: /runtime/hf_modules
        - name: XDG_CACHE_HOME
          value: /runtime/cache
        - name: TRITON_CACHE_DIR
          value: /runtime/triton
        - name: TORCH_EXTENSIONS_DIR
          value: /runtime/torch_extensions
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: GLOO_SOCKET_IFNAME
          value: eth0
        - name: DYN_SYSTEM_PORT
          value: '8081'
        - name: SGLANG_JIT_DEEPGEMM_PRECOMPILE
          value: '0'
        - name: SGLANG_JIT_DEEPGEMM_FAST_WARMUP
          value: '1'
        - name: UCX_TLS
          value: rc,cuda_copy,cuda_ipc,sm,self
        - name: UCX_NET_DEVICES
          value: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1
        - name: UCX_RNDV_SCHEME
          value: get_zcopy
        - name: UCX_LOG_LEVEL
          value: info
        resources:
          requests:
            cpu: '32'
            memory: 512Gi
            nvidia.com/gpu: '8'
          limits:
            memory: 1300Gi
            nvidia.com/gpu: '8'
        securityContext:
          runAsUser: 0
          capabilities:
            add:
            - IPC_LOCK
            - SYS_RESOURCE
        startupProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 480
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 15
          timeoutSeconds: 5
        volumeMounts:
        - name: model
          mountPath: /model
          readOnly: true
        - name: shm
          mountPath: /dev/shm
        - name: model
          mountPath: /runtime
          subPath: .runtime/runtime
        - name: model
          mountPath: /root/.cache
          subPath: .runtime/root-cache
        - name: model
          mountPath: /root/.tilelang
          subPath: .runtime/tilelang
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: model-0
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 128Gi
      nodeSelector:
        kubernetes.io/hostname: <NODE_A_HOSTNAME>
      initContainers:
      - name: wait-for-model
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until grep -qx 72e1d3230f6c080a530b0a1d46f8eb4602340597 /model/DEPLOYED_REVISION;
          do sleep 15; done
        volumeMounts:
        - name: model
          mountPath: /model
          readOnly: true
      - name: init-runtime-cache
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - mkdir -p /model/.runtime/runtime /model/.runtime/root-cache /model/.runtime/tilelang
        volumeMounts:
        - name: model
          mountPath: /model
