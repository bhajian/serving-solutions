    - alert: DynamoNoWorkersRegistered
      expr: sum by (namespace) (dynamo_component_router_worker_registered) == 0
      for: 5m
      labels:
        severity: page
      annotations:
        summary: Frontend router has no registered workers; requests return 503
        runbook: reference/troubleshooting.md#endpoint-returns-503-not-ready-while-every-pod-is-ready
    - alert: DynamoPrefillWorkersMissing
      expr: (sum by (namespace) (dynamo_component_router_worker_registered{worker_type="decode"}) > 0) unless (sum by (namespace) (dynamo_component_router_worker_registered{worker_type="prefill"}) > 0)
      for: 2m
      labels:
        severity: page
      annotations:
        summary: 'Decode workers registered but no prefill workers: the prefill router is deactivated'
        runbook: reference/troubleshooting.md#endpoint-returns-503-not-ready-while-every-pod-is-ready
    - alert: DynamoPrefillHostMemoryHigh
      expr: max by (namespace, pod) (container_memory_working_set_bytes{container="main", pod=~".+-prefill-.+"}) / max by (namespace, pod) (kube_pod_container_resource_limits{container="main", resource="memory",
        pod=~".+-prefill-.+"}) > 0.7
      for: 1m
      labels:
        severity: page
      annotations:
        summary: Prefill worker host memory above 70% of its limit (OOM risk; observed 308 GiB peaks)
        runbook: reference/troubleshooting.md#prefill-pod-host-memory-swings-104--308-gib-and-is-oom-killed-at-384-gib
    - alert: DynamoKvTransferBootstrapSlow
      expr: histogram_quantile(0.99, sum by (namespace, le) (rate(sglang:kv_transfer_bootstrap_ms_bucket[5m]))) > 5000
      for: 10m
      labels:
        severity: ticket
      annotations:
        summary: NIXL bootstrap p99 above 5 s; check IB links and UCX devices
    - alert: DynamoPrefillBootstrapBacklog
      expr: max by (namespace, pod) (sglang:num_prefill_bootstrap_queue_reqs) > 32
      for: 10m
      labels:
        severity: ticket
      annotations:
        summary: Requests waiting for a KV transfer handshake
    - alert: DynamoQueueGrowing
      expr: max by (namespace, component_type) (sglang:num_queue_reqs) > 0 and deriv(max by (namespace, component_type) (sglang:num_queue_reqs)[15m:1m]) > 0
      for: 15m
      labels:
        severity: ticket
      annotations:
        summary: Worker queue growing for 15 minutes in one pool (prefill, decode or aggregated)
    - alert: DynamoKvPoolExhausted
      expr: max by (namespace, pod) (sglang:token_usage) > 0.95
      for: 10m
      labels:
        severity: ticket
      annotations:
        summary: KV pool above 95%; retractions likely
    - alert: DynamoRequestsRetracted
      expr: max by (namespace, pod) (sglang:num_retracted_reqs) > 0
      for: 5m
      labels:
        severity: ticket
      annotations:
        summary: Requests retracted for lack of KV space
