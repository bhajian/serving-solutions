        > 0
      for: 0m
      labels:
        severity: ticket
      annotations:
        summary: InfiniBand errors or link-downs on a GPU node
    - alert: GpuXidError
      expr: max by (Hostname, gpu) (DCGM_FI_DEV_XID_ERRORS) > 0
      for: 0m
      labels:
        severity: page
      annotations:
        summary: GPU reported an XID error
    - alert: DynamoCanaryFailing
      expr: max by (namespace) (kube_job_status_failed{job_name=~"inference-canary-.*"}) > 0
      for: 10m
      labels:
        severity: page
      annotations:
        summary: End-to-end chat completion through the gateway is failing
